name: vibe-radar-workbench
services:
  workbench:
    image: ${RADAR_IMAGE:-ghcr.io/saksim/vibe_job_radar:0.20.0}
    command:
      - --workspace
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --origin
      - ${RADAR_ORIGIN:-http://localhost:8080}
      - --password-file
      - /run/secrets/radar-password
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - radar-data:/data
    secrets:
      - source: radar-password
        target: radar-password
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      replicas: 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); assert r.status == 200 and json.load(r) == {'ok': True}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  radar-data:
secrets:
  radar-password:
    file: ${RADAR_PASSWORD_FILE:?Set RADAR_PASSWORD_FILE to an external absolute password-file path}
