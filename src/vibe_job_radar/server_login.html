<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Vibe Job Radar 服务器工作台</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#f3f6fa;color:#192b3f;margin:0}main{max-width:480px;margin:10vh auto;padding:28px;background:white;border:1px solid #dce3ec;border-radius:12px}input,button{font:inherit;padding:10px;box-sizing:border-box;width:100%;margin:8px 0}button{background:#265b94;color:white;border:0;border-radius:6px}p{overflow-wrap:anywhere}#error{color:#983022}</style>
<script src="/server-login.js" defer></script></head><body><main>
<h1>服务器工作台</h1><p>这是你在服务器上的私人工作区。上传的 JD、项目材料和报告保存在服务器，由部署者管理和备份。</p>
<form id="login"><label for="password">工作台访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512"><button id="submit">登录</button></form>
<p id="error" role="alert"></p><p>此入口只供一个拥有者使用；招聘平台登录和桌面浏览器采集请使用桌面版。</p></main></body></html>
