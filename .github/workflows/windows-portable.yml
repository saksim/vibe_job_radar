name: windows-portable-candidate
run-name: WPAD actual DNS source control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wpad-dns-source-control:
    runs-on: windows-latest
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise real DNS WPAD through application API
        run: python scripts/run_wpad_dns_source_control.py
      - name: Preserve bounded source control and restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wpad-dns-source-control
          retention-days: 7
          if-no-files-found: error
          path: release-verification/wpad-dns-source-control/result.json
