name: windows-portable-candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-run-executable:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned candidate build components in ephemeral runner
        run: python -m pip install "pyinstaller==6.22.3" "playwright==1.63.0" "packaging==26.0" "truststore==0.10.4" tzdata
      - name: Download matching Chromium into the bundled Playwright layout
        run: python -m playwright install chromium
      - name: Qualify exact source with every required check
        run: python scripts/verify_candidate.py
      - name: Freeze, launch, exercise and archive actual executable
        run: python scripts/build_windows_portable.py --verify-login-startup
      - name: Preserve source and executable evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-evidence
          retention-days: 7
          path: |
            release-verification/
            portable-candidate/manifest.json
            portable-candidate/portable-verification.json
            portable-candidate/*.png
      - name: Save verified portable candidate without publishing a release
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable-candidate
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: portable-candidate/*.zip
