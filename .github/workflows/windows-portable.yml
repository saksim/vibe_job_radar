name: windows-portable-candidate
run-name: WPAD hosted preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wpad-host-preflight:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Observe hosted Windows WPAD prerequisites without discovery or configuration changes
        shell: pwsh
        run: ./scripts/wpad_host_preflight.ps1 -OutputPath ./release-verification/wpad-host-preflight.json
      - name: Preserve bounded read-only host observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wpad-host-preflight
          retention-days: 7
          if-no-files-found: error
          path: release-verification/wpad-host-preflight.json
