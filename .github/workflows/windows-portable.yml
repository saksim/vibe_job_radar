name: diagnostic-chrome-startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-launch:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, blank, sdk]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "playwright==1.64.0" "packaging==26.3"
      - run: python scripts/diagnose_chrome_startup.py --variant ${{ matrix.variant }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-${{ matrix.variant }}
          path: startup-comparison.json
          retention-days: 7
