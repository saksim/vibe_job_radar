name: browser-choice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installed-edge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the supported Python SDK
        run: python -m pip install "playwright>=1.48,<2" "packaging>=24.2"
      - name: Check already-installed Edge through the actual collector
        run: python scripts/run_browser_choice_acceptance.py
      - name: Verify workspace DNS policy inside real Edge request callbacks
        run: python scripts/run_browser_policy_binding.py --channel msedge
      - name: Preserve exact check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-choice-windows
          retention-days: 7
          path: |
            browser-acceptance/browser-choice/
            browser-acceptance/policy-binding/
  installed-chrome:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the supported Python SDK
        run: python -m pip install "playwright>=1.48,<2" "packaging>=24.2"
      - name: Check already-installed Chrome through the actual collector
        run: python scripts/run_browser_choice_acceptance.py --channel chrome
      - name: Check explicit native Chrome selection and clean shutdown
        run: python scripts/run_browser_choice_acceptance.py --channel chrome --backend native
      - name: Verify workspace DNS policy inside real Chrome callbacks
        run: python scripts/run_browser_policy_binding.py --channel chrome
      - name: Verify login agreement handoff with local Chrome fixtures
        run: |
          python scripts/verify_password_form.py --channel chrome
          python scripts/verify_password_form.py --channel chrome --native
      - name: Preserve exact Chrome check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-choice-chrome-windows
          retention-days: 7
          path: |
            browser-acceptance/browser-choice-chrome/
            browser-acceptance/browser-choice-chrome-native/
            browser-acceptance/policy-binding/
