name: browser-installation-health
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  real-browser-health:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            playwright: playwright==1.57.0
            label: windows-1.57
          - os: ubuntu-latest
            playwright: playwright==1.57.0
            label: linux-1.57
          - os: ubuntu-latest
            playwright: playwright>=1.48,<2
            label: linux-current
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install selected Python SDK
        run: python -m pip install "${{ matrix.playwright }}" "packaging>=24.2"
      - name: Install matching Windows Chromium (same command as desktop users)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Install matching Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: |
          python scripts/configure_ci_apt.py
          python -m playwright install --with-deps chromium
      - name: Exercise visible collector check on Windows
        if: runner.os == 'Windows'
        run: |
          python scripts/run_browser_health_acceptance.py
          python scripts/run_desktop_repair_browser.py
      - name: Exercise visible collector check on Linux desktop
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python scripts/run_browser_health_acceptance.py
          xvfb-run -a python scripts/run_desktop_repair_browser.py
      - name: Keep startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: browser-health-${{ matrix.label }}
          path: browser-acceptance/browser-health/
