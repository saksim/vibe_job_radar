name: offline-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  workspace-compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ec4587992113848be879da2fbc4cebdac62d10e2
          path: .verify/compat-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify old workspace upgrade and rollback with artificial data
        run: python scripts/check_workspace_compatibility.py --old-source .verify/compat-baseline
      - name: Save compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: workspace-compatibility-${{ matrix.os }}
          path: browser-acceptance/compatibility/
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional browser version validator for tests
        run: python -m pip install "packaging>=24.2" tzdata
      - run: python scripts/run_tests.py --report acceptance/results.json
      - run: python scripts/run_demo.py
      - run: python scripts/start_workbench.py --doctor --workspace .ci-source-workspace
      - name: Verify installed entrypoint and bundled UI
        run: |
          python -m pip install --no-deps .
          vibe-radar-ui --doctor --workspace .ci-installed-workspace
          python -c "import importlib.metadata as m; from vibe_job_radar import __version__; assert m.version('vibe-job-radar') == __version__"
          python -c "from importlib.resources import files; p=files('vibe_job_radar'); assert p.joinpath('workbench.html').is_file(); assert p.joinpath('workbench.js').is_file()"
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: acceptance-${{ matrix.os }}-${{ matrix.python }}
          path: acceptance/
      - name: Create source archive
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: git archive --format=zip --output=vibe-job-radar-source.zip HEAD
      - name: Save source archive
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: source-checkout
          path: vibe-job-radar-source.zip
