name: browser-acceptance
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  browser-exercises:
    runs-on: ubuntu-latest
    # Installation and the full browser suite have separate bounded budgets.
    # Keep two minutes outside their 8m + 10m limits for checkout and evidence.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install developer-only browser test tools
        timeout-minutes: 8
        run: |
          python -m pip install playwright "packaging>=24.2"
          python -m playwright install --with-deps chromium
      - name: Exercise actual browser onboarding and downloads
        timeout-minutes: 10
        run: |
          python scripts/run_browser_acceptance.py
          python scripts/run_advanced_browser.py
          python scripts/run_collection_guidance_browser.py
          python scripts/run_resume_browser.py
          python scripts/run_guided_browser.py
          python scripts/verify_password_form.py
          python scripts/run_guided_startup_browser.py
          python scripts/run_guided_review_browser.py
          python scripts/run_deferred_browser.py
          python scripts/run_read_retry_browser.py
          python scripts/run_read_retry_browser.py --automatic
          python scripts/run_proxy_auth_browser.py
          python scripts/run_public_poll_handoff_browser.py
          python scripts/run_recovery_browser.py
          python scripts/run_public_owner_browser.py
          python scripts/run_network_settings_browser.py
          python scripts/run_workspace_proxy_browser.py
          python scripts/run_workspace_proxy_browser.py --vm
          python scripts/run_pac_browser.py
          python scripts/run_system_pac_browser.py
          python scripts/run_public_schedule_browser.py
          python scripts/run_public_outcomes_browser.py
          python scripts/run_public_worker_browser.py
          python scripts/run_public_queue_browser.py
          python scripts/run_public_schedule_handoff_browser.py
          python scripts/run_public_sources_browser.py
          python scripts/run_cursor_public_browser.py
          python scripts/run_public_revalidation_browser.py
          python scripts/run_windows_startup_browser.py
          python scripts/run_guided_owner_browser.py
          python scripts/run_research_workflow_browser.py
          python scripts/run_native_login_browser.py
          python scripts/run_login_detail_return_browser.py
          python scripts/run_login_detail_return_browser.py --pending-action
          python scripts/run_login_detail_return_browser.py --automatic
          python scripts/run_target_acquisition_browser.py
          python scripts/run_browser_policy_binding.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: browser-acceptance
          path: browser-acceptance/
  chromium-user-journey:
    # Browser execution and full source qualification must each have their own
    # job budget. A browser failure still prevents candidate verification/build.
    # Keep the original required-check name as the final gate. A skipped
    # dependent job can satisfy GitHub requirements, so fail it explicitly.
    needs: browser-exercises
    if: always()
    runs-on: ubuntu-latest
    # 1200s unit + 3x180s auxiliary checks + the original 6m setup/build/upload
    # allowance. Keep this outer budget aligned with the verifier limits.
    timeout-minutes: 35
    steps:
      - name: Require successful browser exercises
        env:
          BROWSER_RESULT: ${{ needs['browser-exercises'].result }}
        run: test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source qualification dependencies
        run: |
          python -m pip install playwright "packaging>=24.2"
          python -m playwright install --with-deps chromium
      - name: Verify exact source before building candidate
        run: python scripts/verify_candidate.py
      - name: Save source verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: source-verification
          path: release-verification/
      - name: Build source release candidate
        run: python scripts/build_candidate.py
      - name: Save source release candidate
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: source-release-candidate
          path: release-candidate/
