name: live-public-example
on:
  pull_request:
    paths:
      - 'src/vibe_job_radar/public_example.py'
      - 'src/vibe_job_radar/local_public.py'
      - 'src/vibe_job_radar/public_boards.py'
      - 'src/vibe_job_radar/public_contract.py'
      - 'scripts/check_live_local_public.py'
      - 'src/vibe_job_radar/network.py'
      - 'src/vibe_job_radar/encrypted_dns.py'
      - 'src/vibe_job_radar/dns_wire.py'
      - 'src/vibe_job_radar/network_settings.py'
      - 'scripts/check_live_encrypted_dns.py'
      - 'src/vibe_job_radar/redirect_policy.py'
      - 'scripts/check_live_public_example.py'
      - '.github/workflows/live-public-example.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One actual public Greenhouse GET, no Key, no browser
        run: python scripts/check_live_public_example.py --live
      - name: One local-direct board GET after conservative spacing
        run: |
          python -c "import time; time.sleep(31)"
          python scripts/check_live_local_public.py --live
      - name: One fixed Cloudflare board GET after conservative spacing
        run: |
          python -c "import time; time.sleep(31)"
          python scripts/check_live_local_public.py --live --source cloudflare
      - name: Consented DoH repair with simulated local mapping and real public GET
        run: |
          python -c "import time; time.sleep(31)"
          python scripts/check_live_encrypted_dns.py --live
      - name: Save only metadata and counts, not third-party full text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-public-example
          path: live-evidence/
