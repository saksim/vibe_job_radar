name: prepare-portable-release
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful windows-portable-candidate push run on main
        required: true
        type: string
      channel:
        description: Release channel (stable uses vMAJOR.MINOR.PATCH)
        type: choice
        options: [prerelease, stable]
        default: prerelease
      publish:
        description: Publish after all eight uploaded assets and exact main CI are verified
        type: boolean
        default: false
      change_notes:
        description: 'Markdown sections: 解决了什么, 提高了什么, 验证结果, 剩余问题; include Issue/PR links'
        required: true
        type: string
concurrency:
  group: prepare-portable-release-${{ inputs.candidate_run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  unsigned-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
      TMPDIR: ${{ github.workspace }}/.release-temp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare project-local temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse qualified candidate and prepare selected unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CHANGE_NOTES: ${{ inputs.change_notes }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          python -c "import os,pathlib; pathlib.Path('.release-temp/changes.md').write_text(os.environ['CHANGE_NOTES'], encoding='utf-8')"
          publish_args=()
          if [ "$PUBLISH_RELEASE" = "true" ]; then publish_args+=(--publish); fi
          python scripts/prepare_portable_release.py --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --out release-draft --create-draft --channel "$RELEASE_CHANNEL" --change-notes .release-temp/changes.md "${publish_args[@]}"
      - name: Retain preparation result including partial upload failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preparation-result
          retention-days: 30
          path: |
            release-draft/prepared.json
            release-draft/create-draft-request.json
            release-draft/created-draft.json
            release-draft/publish-request.json
            release-draft/published-release.json
            release-draft/assets/provenance.json
            release-draft/assets/SHA256SUMS.txt
