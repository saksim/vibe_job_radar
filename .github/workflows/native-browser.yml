name: native-browser-acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [headless, headed]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install developer-only native browser tools
        run: python -m pip install "playwright>=1.48,<2" "packaging>=24.2" "cryptography>=43"
      - name: Install Chromium and isolated test trust tooling
        if: runner.os == 'Linux'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools xvfb
      - name: Compare public page CDP session on Windows
        if: runner.os == 'Windows' && matrix.mode == 'headless'
        run: python scripts/probe_native_page_session.py --controlled --channel msedge
      - name: Verify native Chromium with artificial local TLS source
        if: runner.os == 'Linux' && matrix.mode == 'headless'
        run: python scripts/run_native_auth_probe.py --controlled
      - name: Verify headed native Chromium with artificial local TLS source
        if: runner.os == 'Linux' && matrix.mode == 'headed'
        run: xvfb-run -a python scripts/run_native_auth_probe.py --controlled --headed
      - name: Verify installed Edge with artificial local TLS source
        if: always() && runner.os == 'Windows'
        # Bound this test step so a stalled browser still leaves its checkpoint
        # and stack dump for the always() artifact step; failure remains fatal.
        timeout-minutes: 3
        run: python scripts/run_native_auth_probe.py --controlled --channel msedge ${{ matrix.mode == 'headed' && '--headed' || '' }}
      - name: Verify recorded Liepin CORS search through native Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: ${{ matrix.mode == 'headed' && 'xvfb-run -a' || '' }} python scripts/run_native_liepin_probe.py --controlled ${{ matrix.mode == 'headed' && '--headed' || '' }}
      - name: Verify recorded Liepin CORS search through native Edge
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python scripts/run_native_liepin_probe.py --controlled --channel msedge ${{ matrix.mode == 'headed' && '--headed' || '' }}
      - name: Verify native authenticated proxies on Linux
        if: runner.os == 'Linux' && matrix.mode == 'headless'
        timeout-minutes: 3
        run: python scripts/run_native_proxy_auth.py --controlled
      - name: Verify headed native authenticated proxies on Linux
        if: runner.os == 'Linux' && matrix.mode == 'headed'
        timeout-minutes: 3
        run: xvfb-run -a python scripts/run_native_proxy_auth.py --controlled --headed
      - name: Verify native authenticated proxies on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python scripts/run_native_proxy_auth.py --controlled --channel msedge ${{ matrix.mode == 'headed' && '--headed' || '' }}
      # Native PAC is Windows-only; its temporary CA is never installed locally.
      - name: Verify native PAC through HTTP and SOCKS5 on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python scripts/run_native_pac_browser.py --controlled ${{ matrix.mode == 'headed' && '--headed' || '' }}
      - name: Verify PAC import and rollback in actual Edge
        if: runner.os == 'Windows' && matrix.mode == 'headless'
        run: python scripts/run_pac_browser.py --edge
      - name: Verify finite native document retries on Linux
        if: runner.os == 'Linux' && matrix.mode == 'headless'
        run: python scripts/run_native_read_retry.py --controlled
      - name: Verify headed finite native document retries on Linux
        if: runner.os == 'Linux' && matrix.mode == 'headed'
        run: xvfb-run -a python scripts/run_native_read_retry.py --controlled --headed
      - name: Verify finite native document retries on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: python scripts/run_native_read_retry.py --controlled --channel msedge ${{ matrix.mode == 'headed' && '--headed' || '' }}
      - name: Preserve native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-${{ runner.os }}-${{ matrix.mode }}
          retention-days: 7
          path: |
            browser-acceptance/native/
            browser-acceptance/native-proxy-auth/
            browser-acceptance/native-pac/
            browser-acceptance/windows-pac/
            browser-acceptance/native-read-retry/
