name: windows-native-tls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-chain-and-repair:
    runs-on: windows-latest
    # The full Windows suite with truststore runs in offline-tests. This job
    # retains real certificate-chain, repair UI and focused TLS verification.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native verifier and developer-only fixtures
        run: python -m pip install "truststore>=0.10.4,<0.11" "cryptography>=44,<47" "playwright>=1.48,<2" "packaging>=24.2" tzdata "quickjs-ng==0.17.0.1"
      - name: Reproduce missing intermediate and verify native chain recovery
        run: python scripts/check_windows_native_tls.py
      - name: Exercise repair consent and service restart in existing Edge
        run: python scripts/run_tls_repair_browser.py
      - name: TLS regressions with the native dependency installed
        timeout-minutes: 3
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_tls*.py" -v *> native-tls-evidence/tls-unit.log
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath native-tls-evidence/tls-unit.log
          exit $testExit
      - name: Check real system trust with existing opt-in public source smoke
        run: python scripts/check_live_encrypted_dns.py --live
      - name: Preserve chain, UI, tests and limited live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-tls
          retention-days: 7
          path: |
            native-tls-evidence/
            live-evidence/
