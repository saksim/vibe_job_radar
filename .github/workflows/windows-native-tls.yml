name: windows-native-tls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-chain-and-repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native verifier and developer-only fixtures
        run: python -m pip install "truststore>=0.10.4,<0.11" "cryptography>=44,<47" "playwright>=1.48,<2" "packaging>=24.2" tzdata
      - name: Reproduce missing intermediate and verify native chain recovery
        run: python scripts/check_windows_native_tls.py
      - name: Exercise repair consent and service restart in existing Edge
        run: python scripts/run_tls_repair_browser.py
      - name: Full regression with the native dependency installed
        run: python scripts/run_tests.py --report native-tls-evidence/unit-results.json
      - name: Check real system trust with existing opt-in public source smoke
        run: python scripts/check_live_encrypted_dns.py --live
      - name: Preserve chain, UI, tests and limited live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-tls
          retention-days: 7
          path: |
            native-tls-evidence/
            live-evidence/
