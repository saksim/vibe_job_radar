[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-job-radar"
dynamic = ["version"]
description = "Evidence-first Chinese recruiting requirement analysis and measurable profile drafting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WEIYU AI Studio"}]
dependencies = []

[project.optional-dependencies]
acceptance = ["tzdata"]
browser = ["playwright>=1.48,<2", "packaging>=24.2"]
tls = ["truststore>=0.10.4,<0.11; sys_platform == 'win32'"]

[project.scripts]
vibe-radar = "vibe_job_radar.cli:main"
vibe-radar-ui = "vibe_job_radar.workbench:main"
vibe-radar-collect = "vibe_job_radar.collection:main"

[tool.setuptools.dynamic]
version = {attr = "vibe_job_radar._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibe_job_radar = ["defaults.json", "workbench.html", "workbench.js", "advanced.html", "advanced.js", "collection_help.js", "guided.html", "guided.js", "network_settings.js", "public_schedule.js", "windows_startup.js"]
